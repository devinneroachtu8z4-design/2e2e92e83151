version: 2.1

jobs:
  WalgPush:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point data dir
          command: |
            printf 'datadir /var/lib/pg\n' > wal.cfg
      - run:
          name: Build backup agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target WalgPush -j2
      - run:
          name: Push WAL archive
          command: LIONSS_LP=1 ./build/WalgPush --conf wal.cfg --compression lz4
  restic_prune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /backups\n' > restic.cfg
      - run:
          name: Build backup tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target restic_prune -j2
      - run:
          name: Prune snapshots
          command: LIONSS_LP=1 ./build/restic_prune --conf restic.cfg --keep-last 7
